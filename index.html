<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Padaria Doce Sabor - Pão Quentinho</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1E1E1E">
    
    <!-- SDK Oficial do OneSignal v16 atualizado -->
    <script src="https://onesignal.com" async></script>
    <script>
        const ONESIGNAL_APP_ID = "f41c3cb4-bef4-4144-9a2b-9f823fd5fe4d";
        const SAFARI_WEB_ID = "safari.web.id.onesignal.auto.2b467c5d-2ccd-4ce0-a57b-cb7ab9cfd0c8";

        // Cria a fila segura exigida pela v16
        window.OneSignalDeferred = window.OneSignalDeferred || [];
        
        window.OneSignalDeferred.push(async function(OneSignal) {
            await OneSignal.init({
                appId: ONESIGNAL_APP_ID,
                safari_web_id: SAFARI_WEB_ID,
                allowLocalhostAsSecureOrigin: true
            });

            // Se o usuário já tiver a permissão ativa de antes, já captura o ID automaticamente
            let subscriptionId = OneSignal.User.PushSubscription.id;
            if (subscriptionId) {
                configurarDispositivoConectado(subscriptionId);
            }
        });

        function configurarDispositivoConectado(subscriptionId) {
            document.getElementById("onesignal_id").value = subscriptionId;
            const botaoAutorizar = document.getElementById("btn-autorizar");
            if (botaoAutorizar) botaoAutorizar.style.display = "none";
            document.getElementById("status-container").innerHTML = "<div class='success'>✅ Aparelho Autorizado e Conectado!</div>";
            document.getElementById("btn-cadastrar").disabled = false;
        }

        // CORREÇÃO DA V16: Executa a chamada usando a fila segura OneSignalDeferred
        function autorizarNotificacoes() {
            const botao = document.getElementById("btn-autorizar");
            botao.innerText = "🔄 Verificando permissão...";

            window.OneSignalDeferred.push(async function(OneSignal) {
                try {
                    // Comando oficial correto para disparar o prompt nativo
                    await OneSignal.Notifications.requestPermission();
                    
                    let checaToken = setInterval(async () => {
                        let subscriptionId = OneSignal.User.PushSubscription.id;
                        if (subscriptionId) {
                            clearInterval(checaToken);
                            configurarDispositivoConectado(subscriptionId);
                        }
                    }, 1000);
                } catch(e) {
                    alert("Erro ao ativar notificações: " + e);
                    botao.innerText = "👉 CLIQUE AQUI PARA AUTORIZAR NOTIFICAÇÕES 🔔";
                }
            });
        }

        function enviarCadastro(event) {
            event.preventDefault();
            
            const nome = document.getElementById("nome").value.trim();
            const whatsapp = document.getElementById("whatsapp").value.trim();
            const id_dispositivo = document.getElementById("onesignal_id").value;
            const preferencia = document.getElementById("preferencia").value;
            const turno = document.getElementById("turno").value;

            if (!nome || !whatsapp || !id_dispositivo) {
                alert("Por favor, preencha todos os campos e autorize as notificações!");
                return;
            }

            const urlStreamlit = `https://streamlit.app{encodeURIComponent(nome)}&id=${encodeURIComponent(id_dispositivo)}&wpp=${encodeURIComponent(whatsapp)}&pref=${encodeURIComponent(preferencia)}&turno=${encodeURIComponent(turno)}`;
            window.location.href = urlStreamlit;
        }
    </script>

    <style>
        body { background-color: #121212; color: #FFF; font-family: sans-serif; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { max-width: 400px; width: 100%; }
        .banner { text-align: center; background-color: #1E1E1E; padding: 25px; border-radius: 12px; border: 1px solid #FFA500; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; display: flex; flex-direction: column; }
        label { font-weight: bold; margin-bottom: 5px; color: #AAA; font-size: 14px; }
        input, select { padding: 12px; border-radius: 6px; border: 1px solid #444; background-color: #222; color: white; font-size: 16px; }
        .btn { width: 100%; padding: 14px; border: none; border-radius: 6px; font-weight: bold; font-size: 16px; cursor: pointer; transition: 0.2s; margin-top: 10px; }
        .btn-orange { background-color: #FFA500; color: white; box-shadow: 0px 4px 6px rgba(0,0,0,0.3); }
        .btn-green { background-color: #28a745; color: white; }
        .btn-green:disabled { background-color: #555; color: #888; cursor: not-allowed; }
        .info { background-color: #17a2b8; padding: 12px; border-radius: 6px; font-size: 14px; margin-bottom: 15px; line-height: 1.4; text-align: center; }
        .success { background-color: #28a745; padding: 12px; border-radius: 6px; text-align: center; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <div class="banner">
        <span style="font-size: 3.5rem;">🥖</span>
        <h1 style="font-size: 2rem; margin: 10px 0 0 0;">Seja Bem-Vindo!</h1>
        <p style="color: #FFA500; font-weight: bold; margin: 5px 0 0 0;">Padaria Doce Sabor</p>
        <p style="font-size: 0.9rem; color: #AAA; margin: 10px 0 0 0;">Receba um aviso direto na tela do seu celular assim que o pão sair quentinho!</p>
    </div>

    <div id="status-container" style="margin-bottom: 15px;"></div>
    <button type="button" id="btn-autorizar" class="btn btn-orange" onclick="autorizarNotificacoes()">👉 CLIQUE AQUI PARA AUTORIZAR NOTIFICAÇÕES 🔔</button>

    <form onsubmit="enviarCadastro(event)" style="margin-top: 15px;">
        <input type="hidden" id="onesignal_id" name="onesignal_id" required>
        
        <div class="form-group">
            <label>Seu Nome *:</label>
            <input type="text" id="nome" placeholder="Ex: João Silva" required>
        </div>

        <div class="form-group">
            <label>Seu WhatsApp (com DDD) *:</label>
            <input type="tel" id="whatsapp" placeholder="Ex: 11999998888" required>
        </div>

        <div class="form-group">
            <label>Qual fornada quer acompanhar?</label>
            <select id="preferencia">
                <option value="🥖 Pão Francês">🥖 Pão Francês</option>
                <option value="🧀 Pão de Queijo">🧀 Pão de Queijo</option>
                <option value="🥐 Croissant">🥐 Croissant</option>
            </select>
        </div>

        <div class="form-group">
            <label>Qual horário você costuma vir à padaria?</label>
            <select id="turno">
                <option value="Manhã">Manhã</option>
                <option value="Tarde">Tarde</option>
                <option value="Ambos">Ambos</option>
            </select>
        </div>

        <button type="submit" id="btn-cadastrar" class="btn btn-green" disabled>Me Avise Quando Sair! 🔔</button>
    </form>
</div>

</body>
</html>
