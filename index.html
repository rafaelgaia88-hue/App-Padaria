<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Padaria Doce Sabor - Pão Quentinho</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1E1E1E">
    
    <!-- ==========================================================================
    1- IMPORTAÇÃO DO SDK WEB OFICIAL DO ONESIGNAL (CDN CORRIGIDA)
    ========================================================================== -->
    <!-- Carrega a biblioteca de funções v16 necessária para disparar o pop-up nativo -->
    <script src="https://onesignal.com" defer></script>
    
    <!-- ==========================================================================
    2- INICIALIZAÇÃO TÉCNICA E CAPTURA DE ID DO DISPOSITIVO
    ========================================================================== -->
    <script>
        const ONESIGNAL_APP_ID = "f41c3cb4-bef4-4144-9a2b-9f823fd5fe4d";
        const SAFARI_WEB_ID = "web.onesignal.auto.2b467c5d-2ccd-4ce0-a57b-cb7ab9fd0cb";


        window.OneSignalDeferred = window.OneSignalDeferred || [];
        
        window.OneSignalDeferred.push(async function(OneSignal) {
            // Inicializa a conexão segura com a sua conta do OneSignal
            await OneSignal.init({
                appId: ONESIGNAL_APP_ID,
                safari_web_id: SAFARI_WEB_ID,
                allowLocalhostAsSecureOrigin: true
            });

            // Monitora em tempo real a liberação do Push pelo navegador do cliente
            setInterval(async () => {
                let subscriptionId = OneSignal.User.PushSubscription.id;
                
                // Se o ID único do aparelho for gerado, atualiza a interface e libera o formulário
                if (subscriptionId) {
                    document.getElementById("onesignal_id").value = subscriptionId;
                    document.getElementById("status-container").innerHTML = "<div class='success'>✅ Notificações Ativas e Aparelho Conectado!</div>";
                    document.getElementById("btn-cadastrar").disabled = false;
                }
            }, 1000);
        });
    </script>

    <!-- ==========================================================================
    3- ESTILIZAÇÃO VISUAL DA INTERFACE (CSS DESIGN ESCURO)
    ========================================================================== -->
    <style>
        body { background-color: #121212; color: #FFF; font-family: sans-serif; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { max-width: 400px; width: 100%; }
        .banner { text-align: center; background-color: #1E1E1E; padding: 25px; border-radius: 12px; border: 1px solid #FFA500; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; display: flex; flex-direction: column; }
        label { font-weight: bold; margin-bottom: 5px; color: #AAA; font-size: 14px; }
        input, select { padding: 12px; border-radius: 6px; border: 1px solid #444; background-color: #222; color: white; font-size: 16px; }
        .btn { width: 100%; padding: 14px; border: none; border-radius: 6px; font-weight: bold; font-size: 16px; cursor: pointer; transition: 0.2s; margin-top: 10px; }
        .btn-green { background-color: #28a745; color: white; }
        .btn-green:disabled { background-color: #555; color: #888; cursor: not-allowed; }
        .info { background-color: #FFA500; color: black; padding: 12px; border-radius: 6px; font-size: 14px; margin-bottom: 15px; line-height: 1.4; text-align: center; font-weight: bold; }
        .success { background-color: #28a745; padding: 12px; border-radius: 6px; text-align: center; font-weight: bold; margin-bottom: 15px; }
    </style>
</head>
<body>

<div class="container">
    <!-- ==========================================================================
    4- BANNER PRINCIPAL DE MARKETING DO BALCÃO
    ========================================================================== -->
    <div class="banner">
        <span style="font-size: 3.5rem;">🥖</span>
        <h1 style="font-size: 2rem; margin: 10px 0 0 0;">Seja Bem-Vindo!</h1>
        <p style="color: #FFA500; font-weight: bold; margin: 5px 0 0 0;">Padaria Doce Sabor</p>
        <p style="font-size: 0.9rem; color: #AAA; margin: 10px 0 0 0;">Receba um aviso direto na tela do seu celular assim que o pão sair quentinho!</p>
    </div>

    <!-- ==========================================================================
    5- RECIPIENTE DINÂMICO PARA ALERTAS DE STATUS TÉCNICO
    ========================================================================== -->
    <div id="status-container">
        <div class="info">🔔 Aguarde o aviso de notificação aparecer no topo da tela e clique em "Permitir" para liberar seu cadastro.</div>
    </div>

    <!-- ==========================================================================
    6- FORMULÁRIO DE CAPTAÇÃO E SEGMENTAÇÃO DE PREFERÊNCIAS
    ========================================================================== -->
    <form onsubmit="enviarCadastro(event)">
        <!-- Input invisível que guarda o token do OneSignal gerado pelo Bloco 2 -->
        <input type="hidden" id="onesignal_id" name="onesignal_id" required>
        
        <div class="form-group">
            <label>Seu Nome *:</label>
            <input type="text" id="nome" placeholder="Ex: João Silva" required>
        </div>

        <div class="form-group">
            <label>Seu WhatsApp (com DDD) *:</label>
            <input type="tel" id="whatsapp" placeholder="Ex: 11999998888" required>
        </div>

        <div class="form-group">
            <label>Qual fornada quer acompanhar?</label>
            <select id="preferencia">
                <option value="🥖 Pão Francês">🥖 Pão Francês</option>
                <option value="🧀 Pão de Queijo">🧀 Pão de Queijo</option>
                <option value="🥐 Croissant">🥐 Croissant</option>
            </select>
        </div>

        <div class="form-group">
            <label>Qual horário você costuma vir à padaria?</label>
            <select id="turno">
                <option value="Manhã">Manhã</option>
                <option value="Tarde">Tarde</option>
                <option value="Ambos">Ambos</option>
            </select>
        </div>

        <!-- Botão inicia desativado e só liga quando o Bloco 2 captura o OneSignal_ID -->
        <button type="submit" id="btn-cadastrar" class="btn btn-green" disabled>Me Avise Quando Sair! 🔔</button>
    </form>
</div>

<!-- ==========================================================================
7- LOGICA DE CONCATENAÇÃO E REDIRECIONAMENTO COM QUERY PARAMETERS
========================================================================== -->
<script>
    function enviarCadastro(event) {
        event.preventDefault();
        
        // Coleta todos os valores digitados e limpa espaços vazios
        const nome = document.getElementById("nome").value.trim();
        const whatsapp = document.getElementById("whatsapp").value.trim();
        const id_dispositivo = document.getElementById("onesignal_id").value;
        const preferencia = document.getElementById("preferencia").value;
        const turno = document.getElementById("turno").value;

        // Endereço base de produção hospedado no Streamlit Cloud (sem barra final)
        const linkDoSeuStreamlit = "https://streamlit.app";

        // Monta a string de parâmetros injetando o ponto de interrogação (?) e codificando os textos para URLs limpas
        const urlStreamlit = `${linkDoSeuStreamlit}?nome=${encodeURIComponent(nome)}&id=${encodeURIComponent(id_dispositivo)}&wpp=${encodeURIComponent(whatsapp)}&pref=${encodeURIComponent(preferencia)}&turno=${encodeURIComponent(turno)}`;
        
        // Dispara o redirecionamento forçando o carregamento das variáveis no main.py
        window.location.href = urlStreamlit;
    }
</script>

</body>
</html>
